device:
  brightness: 70

buttons:
  - at: [0, 0]
    label: "Term"
    icon: ~/decks/icons/term.png
    action:
      type: shell
      cmd: "open -a Terminal"

  - at: [1, 0]
    label: "Browser"
    icon: ~/decks/icons/browser.png
    action:
      type: shell
      cmd: "open -a 'Google Chrome'"

  - at: [2, 0]
    label: "Mute"
    action:
      type: key
      key: "cmd shift m"

  - at: [3, 0]
    label: "Play"
    action:
      type: key
      key: "space"

  - at: [4, 0]
    label: "Reload"
    action:
      type: key
      key: "cmd r"
