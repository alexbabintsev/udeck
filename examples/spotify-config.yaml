device:
  brightness: 65
  label_style:
    align: center
    color: "#F6F6F6"
    font_name: "Roboto"
    show_title: false
    size: 11
    weight: 90

buttons:
  - at: [0, 0]
    widget:
      type: spotify_play_pause

  - at: [1, 0]
    widget:
      type: spotify_next

  - at: [2, 0]
    widget:
      type: spotify_artwork

  - at: [3, 0]
    label: "Back"
    icon: test-icons/apps-folder.png
    action:
      type: shell
      cmd: "open -a Spotify"
